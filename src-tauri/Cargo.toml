[package]
name = "typerx-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[lib]
name = "typerx_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.4.1", features = [] }
# Keep the host-side code generator on the tauri-v2.8.5 release manifest set.
tauri-codegen = { version = "=2.4.0", default-features = false }
tauri-utils = { version = "=2.7.0", default-features = false }

[dependencies]
tauri = { version = "=2.8.5", features = [] }

# Compatibility anchors from upstream tag tauri-v2.8.5 (80eadb7387459639037e3a279c61c9631b1dafe7).
# Pin the whole runtime/codegen boundary, not just the top-level tauri crate.
# default-features=false avoids enabling additional features via these anchors;
# tauri itself continues to enable its normal required features.
tauri-runtime = { version = "=2.8.0", default-features = false }
tauri-runtime-wry = { version = "=2.8.1", default-features = false }
tauri-macros = { version = "=2.4.0", default-features = false }
tauri-utils = { version = "=2.7.0", default-features = false }
wry = { version = "=0.53.2", default-features = false }
tao = { version = "=0.34.1", default-features = false }

serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.143"
tokio = { version = "=1.47.1", features = ["process", "io-util", "sync", "time", "rt-multi-thread", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
